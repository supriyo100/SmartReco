<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartReco{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="/">SmartReco</a>
  <form class="search" action="/search" method="get">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="Search courses…" aria-label="Search courses">
  </form>
  <nav>
    {% if user_id %}
      <a href="/recommendations">For you</a>
      <a href="/profile">Profile</a>
      {% if role == 'admin' %}<a href="/admin">Admin</a>{% endif %}
      <form class="inline" action="/auth/logout" method="post"><button type="submit">Log out</button></form>
    {% else %}
      <a href="/auth/login">Log in</a>
      <a class="cta" href="/auth/register">Sign up</a>
    {% endif %}
  </nav>
</header>

<main>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  {% if message %}<p class="flash ok">{{ message }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>

<script src="/static/tracker.js" defer></script>
</body>
</html>
