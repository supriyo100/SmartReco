{% extends "base.html" %}
{% block title %}Log in — SmartReco{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  <form method="post" action="/auth/login" class="stack">
    <label>Email
      <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="/auth/register">Sign up</a>.</p>
</section>
{% endblock %}
